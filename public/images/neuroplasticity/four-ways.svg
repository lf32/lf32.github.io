<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img">
  <title>Four ways the wiring changes. Same rule, four clocks. The synapse is the fast one.</title>
  <rect width="480" height="640" fill="#f6f5f2"/>
  <rect x="0" y="0" width="480" height="6" fill="#9a3412"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e2124" text-anchor="start">Four ways the wiring changes</text>
  
  <rect x="28" y="72" width="424" height="112" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="70" cy="122" r="16" fill="#f6e7e2" stroke="#9a3412" stroke-width="2"/><circle cx="64" cy="120" r="2" fill="#9a3412"/><circle cx="72" cy="124" r="2" fill="#9a3412"/><rect x="90" y="108" width="8" height="32" rx="2" fill="#ffffff" stroke="#1e2124" stroke-width="1.6"/><circle cx="92" cy="116" r="2" fill="#1f4d3a"/><circle cx="92" cy="124" r="2" fill="#1f4d3a"/><circle cx="92" cy="132" r="2" fill="#1f4d3a"/>
<text x="128" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">The synapse gets louder</text>
<text x="128" y="128" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">Fast. Repeated firing adds more</text>
<text x="128" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">docks on the receiving side. Disuse</text>
<text x="128" y="168" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">takes them away.</text>
<rect x="28" y="196" width="424" height="112" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="66" cy="260" r="8" fill="#ffffff" stroke="#1e2124" stroke-width="1.6"/><path d="M66 252 C 66 234, 84 232, 88 228" fill="none" stroke="#1e2124" stroke-width="1.7"/><path d="M72 256 C 88 248, 96 252, 104 242" fill="none" stroke="#9a3412" stroke-width="1.7"/><path d="M62 254 C 52 242, 56 232, 50 230" fill="none" stroke="#1e2124" stroke-width="1.7" opacity="0.35"/>
<text x="128" y="228" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Branches grow or get pruned</text>
<text x="128" y="252" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">Slower. Dendrites reach toward cells</text>
<text x="128" y="272" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">they work with, and drop the twigs</text>
<text x="128" y="292" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">they stopped using.</text>
<rect x="28" y="320" width="424" height="112" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<line x1="52" y1="372" x2="112" y2="372" stroke="#1e2124" stroke-width="2"/><path d="M56 364 Q 70 354 84 364" fill="none" stroke="#9a3412" stroke-width="2"/><path d="M56 380 Q 70 390 84 380" fill="none" stroke="#9a3412" stroke-width="2"/><path d="M88 364 Q 100 356 112 364" fill="none" stroke="#9a3412" stroke-width="2"/><path d="M88 380 Q 100 388 112 380" fill="none" stroke="#9a3412" stroke-width="2"/>
<text x="128" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">The wire gets insulation</text>
<text x="128" y="376" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">Myelin wraps the axon. The signal</text>
<text x="128" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">gets faster, and a clumsy skill gets</text>
<text x="128" y="416" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">smooth.</text>
<rect x="28" y="444" width="424" height="112" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<path d="M64 480 C 88 480, 96 500, 84 508 C 72 516, 68 508, 76 502" fill="none" stroke="#1e2124" stroke-width="1.8"/><circle cx="78" cy="494" r="3" fill="#9a3412"/><circle cx="86" cy="502" r="2.4" fill="#9a3412"/><circle cx="70" cy="490" r="2" fill="#5c6166"/>
<text x="128" y="476" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">A few new neurons</text>
<text x="128" y="500" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">Small, and mostly in the</text>
<text x="128" y="520" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">hippocampus. Most learning is old</text>
<text x="128" y="540" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">cells changing their links.</text>
  <line x1="28" y1="600" x2="452" y2="600" stroke="#d9d6d0" stroke-width="1"/>
  <text x="28" y="618" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Same rule, four clocks. The synapse is the fast one.</text>
</svg>
