<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" width="480" height="430" role="img">
  <title>Why the hard version teaches. Easy repetition maintains. Effortful repetition remodels.</title>
  <rect width="480" height="430" fill="#f6f5f2"/>
  <rect x="0" y="0" width="480" height="6" fill="#9a3412"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e2124" text-anchor="start">Why the hard version teaches</text>
  
  <rect x="28" y="72" width="424" height="132" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<text x="44" y="98" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Feels like work. Barely teaches.</text>
<text x="44" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">Rereading a page you already highlighted.</text>
<text x="44" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">Repeating a rep you can already do cleanly.</text>
<text x="44" y="170" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">One long Sunday instead of six short days.</text>
<rect x="28" y="216" width="424" height="150" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<rect x="28" y="216" width="8" height="150" rx="2" fill="#9a3412"/>
<text x="52" y="242" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="start">Harder in the moment. This is the rep.</text>
<text x="52" y="270" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Close the book and say it from memory.</text>
<text x="52" y="292" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Practice at the edge of what you can do.</text>
<text x="52" y="314" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Come back tomorrow. Sleep in between.</text>
<text x="52" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">The struggle to recall is the firing.</text>
  <line x1="28" y1="390" x2="452" y2="390" stroke="#d9d6d0" stroke-width="1"/>
  <text x="28" y="408" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Easy repetition maintains. Effortful repetition remodels.</text>
</svg>
