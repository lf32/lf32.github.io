<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 530" width="480" height="530" role="img">
  <title>What this will not do. More effort required is a different claim from impossible.</title>
  <rect width="480" height="530" fill="#f6f5f2"/>
  <rect x="0" y="0" width="480" height="6" fill="#9a3412"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e2124" text-anchor="start">What this will not do</text>
  
  <rect x="28" y="76" width="424" height="84" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<text x="44" y="106" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="start">A Monday mood</text>
<text x="44" y="130" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Tissue follows the reps that happen after the</text>
<text x="44" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">mood leaves.</text>
<rect x="28" y="172" width="424" height="84" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<text x="44" y="202" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="start">Some windows narrow</text>
<text x="44" y="226" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">A language's sounds are easier early. Words</text>
<text x="44" y="244" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">can still be learned at 17.</text>
<rect x="28" y="268" width="424" height="84" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<text x="44" y="298" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="start">The starting map differs</text>
<text x="44" y="322" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Sleep, health, injury, and home change which</text>
<text x="44" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">reps are available.</text>
<rect x="28" y="364" width="424" height="84" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<text x="44" y="394" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a3412" text-anchor="start">Reallocation</text>
<text x="44" y="418" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Hours on one skill are hours the map spends on</text>
<text x="44" y="436" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">that skill.</text>
  <line x1="28" y1="490" x2="452" y2="490" stroke="#d9d6d0" stroke-width="1"/>
  <text x="28" y="508" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">More effort required is a different claim from impossible.</text>
</svg>
