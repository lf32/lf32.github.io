<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" width="480" height="500" role="img">
  <title>A week, not a speech. Frequency beats one heroic session.</title>
  <rect width="480" height="500" fill="#f6f5f2"/>
  <rect x="0" y="0" width="480" height="6" fill="#9a3412"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e2124" text-anchor="start">A week, not a speech</text>
  
  <rect x="28" y="76" width="424" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="107" r="12" fill="#9a3412"/>
<text x="56" y="112" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">1</text>
<text x="80" y="102" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Most days</text>
<text x="80" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Twenty focused minutes of the weak skill.</text>
<rect x="28" y="148" width="424" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="179" r="12" fill="#9a3412"/>
<text x="56" y="184" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">2</text>
<text x="80" y="174" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">One discomfort</text>
<text x="80" y="194" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">The thing you dodge. The same one, repeated.</text>
<rect x="28" y="220" width="424" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="251" r="12" fill="#9a3412"/>
<text x="56" y="256" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">3</text>
<text x="80" y="246" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Then study</text>
<text x="80" y="266" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Move until you are alert. Do the hard thinking next.</text>
<rect x="28" y="292" width="424" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="323" r="12" fill="#9a3412"/>
<text x="56" y="328" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">4</text>
<text x="80" y="318" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">That night</text>
<text x="80" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Sleep. The night of the practice is when it saves.</text>
<rect x="28" y="364" width="424" height="62" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="395" r="12" fill="#9a3412"/>
<text x="56" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">5</text>
<text x="80" y="390" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">The clock</text>
<text x="80" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">A new habit and an old story take different times.</text>
  <line x1="28" y1="460" x2="452" y2="460" stroke="#d9d6d0" stroke-width="1"/>
  <text x="28" y="478" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Frequency beats one heroic session.</text>
</svg>
