<circle cx="40" cy="282" r="9" fill="#9a3412"/>
<text x="40" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="58" y="286" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Dendrites</text>
<text x="58" y="304" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Branches that listen.</text>
<circle cx="40" cy="322" r="9" fill="#9a3412"/>
<text x="40" y="326" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="58" y="326" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Cell body</text>
<text x="58" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">The neuron itself.</text>
<circle cx="40" cy="362" r="9" fill="#9a3412"/>
<text x="40" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="58" y="366" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Axon</text>
<text x="58" y="384" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">The fiber that speaks.</text>
<circle cx="40" cy="402" r="9" fill="#9a3412"/>
<text x="40" y="406" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="58" y="406" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Myelin</text>
<text x="58" y="424" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Insulation. Speeds the signal.</text>
<circle cx="40" cy="442" r="9" fill="#9a3412"/>
<text x="40" y="446" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="58" y="446" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Synapse</text>
<text x="58" y="464" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">The tiny gap. Signal crosses as a chemical.</text>
<circle cx="40" cy="482" r="9" fill="#9a3412"/>
<text x="40" y="486" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
<text x="58" y="486" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Neurotransmitter</text>
<text x="58" y="504" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">The chemical message, in small packets.</text>
  <line x1="28" y1="540" x2="452" y2="540" stroke="#d9d6d0" stroke-width="1"/>
  <text x="28" y="558" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">A thought is a pattern of these cells firing, not one cell alone.</text>
