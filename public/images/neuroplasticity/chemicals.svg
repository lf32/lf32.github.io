<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img">
  <title>What opens the window. You can sit through a lesson and store almost none of it.</title>
  <rect width="480" height="520" fill="#f6f5f2"/>
  <rect x="0" y="0" width="480" height="6" fill="#9a3412"/>
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e2124" text-anchor="start">What opens the window</text>
  
  <rect x="28" y="72" width="424" height="88" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<text x="44" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#9a3412" text-anchor="start">The gate</text>
<text x="44" y="124" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Acetylcholine marks an input as worth saving.</text>
<text x="44" y="146" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">Boredom leaves this gate mostly shut.</text>
<rect x="28" y="176" width="424" height="64" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="208" r="12" fill="#9a3412"/>
<text x="56" y="213" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">1</text>
<text x="80" y="204" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Attention</text>
<text x="80" y="224" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">You strengthen the circuit you actually run.</text>
<rect x="28" y="250" width="424" height="64" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="282" r="12" fill="#9a3412"/>
<text x="56" y="287" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">2</text>
<text x="80" y="278" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Hard movement</text>
<text x="80" y="298" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">A short bout, then study while you are alert.</text>
<rect x="28" y="324" width="424" height="64" rx="8" fill="#ffffff" stroke="#d9d6d0" stroke-width="1"/>
<circle cx="56" cy="356" r="12" fill="#9a3412"/>
<text x="56" y="361" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">3</text>
<text x="80" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1e2124" text-anchor="start">Sleep</text>
<text x="80" y="372" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">A lot of the saving happens the night you practiced.</text>
<text x="28" y="420" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2124" text-anchor="start">Dopamine is wanting and surprise, not a pleasure juice.</text>
<text x="28" y="440" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5c6166" text-anchor="start">A notification that sometimes matters trains the reach.</text>
  <line x1="28" y1="480" x2="452" y2="480" stroke="#d9d6d0" stroke-width="1"/>
  <text x="28" y="498" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6166" text-anchor="start">You can sit through a lesson and store almost none of it.</text>
</svg>
